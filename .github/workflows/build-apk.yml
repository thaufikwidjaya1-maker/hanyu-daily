name: Build Hanyu Daily APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore tested Hanyu Daily v6 UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/www
          test -f app/src/main/assets/www/index.html.gz.b64.part00
          base64 --decode app/src/main/assets/www/index.html.gz.b64.part00 | gunzip > app/src/main/assets/www/index.html
          test -s app/src/main/assets/www/index.html
          grep -q "HanyuNative" app/src/main/assets/www/index.html
          grep -qi "grammar" app/src/main/assets/www/index.html
          echo "Restored v6 UI: $(wc -c < app/src/main/assets/www/index.html) bytes"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HanyuDaily-v6.apk
          test -s HanyuDaily-v6.apk

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: HanyuDaily-Android-v6
          path: HanyuDaily-v6.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish personal beta APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0-beta
          name: Hanyu Daily v6 Android Beta
          prerelease: true
          make_latest: true
          files: HanyuDaily-v6.apk
          body: |
            Hanyu Daily v6 Android beta.
            - Daily 3 new vocabulary words
            - Daily grammar lesson
            - Vocabulary SRS
            - Listening, reading, writing, and speaking
            - Native Android Mandarin TTS
            - Native Android speech recognition
            - Strict streak and Monday-Sunday learning lamps
            - Santai / Seimbang / Intensif / Custom session volume
