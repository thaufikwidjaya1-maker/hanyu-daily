name: Build Hanyu Daily APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify Hanyu Daily v6 UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/www
          test -f app/src/main/assets/www/v6.b64.00
          test -f app/src/main/assets/www/v6.b64.10
          cat app/src/main/assets/www/v6.b64.* > /tmp/hanyu-v6.b64
          test "$(wc -c < /tmp/hanyu-v6.b64)" -eq 81180
          base64 --decode /tmp/hanyu-v6.b64 | gunzip > app/src/main/assets/www/index.html
          test "$(wc -c < app/src/main/assets/www/index.html)" -eq 216849
          echo "4bff8d2749a560b9f65f45f2890ffa058c659745f54f10704e88e2fd35ff381b  app/src/main/assets/www/index.html" | sha256sum --check
          grep -q "HanyuNative" app/src/main/assets/www/index.html
          grep -qi "grammar" app/src/main/assets/www/index.html
          grep -q "cdn.jsdelivr.net/gh/dcmshi/hsk-study-guide@main" app/src/main/assets/www/index.html
          echo "Verified Hanyu Daily v6 UI."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename and hash APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HanyuDaily-v6-safe.apk
          test -s HanyuDaily-v6-safe.apk
          sha256sum HanyuDaily-v6-safe.apk | tee HanyuDaily-v6-safe.apk.sha256

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: HanyuDaily-v6-safe
          path: |
            HanyuDaily-v6-safe.apk
            HanyuDaily-v6-safe.apk.sha256
          if-no-files-found: error
          retention-days: 90
