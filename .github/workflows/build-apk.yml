name: Build Hanyu Daily APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Hanyu Daily v6 UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/www
          test -f app/src/main/assets/www/index.html.gz.b64.part00
          base64 --decode app/src/main/assets/www/index.html.gz.b64.part00 | gunzip > app/src/main/assets/www/index.html
          test -s app/src/main/assets/www/index.html
          grep -q "HanyuNative" app/src/main/assets/www/index.html || true
          echo "UI size: $(wc -c < app/src/main/assets/www/index.html) bytes"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HanyuDaily-Android-v6
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
